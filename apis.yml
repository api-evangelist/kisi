aid: kisi
name: KISI
description: >-
  Kisi is a cloud-based physical access control platform that combines hardware
  controllers and readers with software dashboards and a full REST API to manage
  building access, doors, locks, elevators, groups, members, access cards,
  visitor management, video surveillance, and security analytics. The Kisi API
  (OpenAPI 3.1, production host https://api.kisi.io) exposes 227 operations
  across 47 resource families, with header/OAuth2 authentication, offset/limit
  pagination, documented rate limits, RFC 8594 deprecation signaling, and a
  published Trust Center (SOC 2 Type 2, ISO/IEC 27001:2022, GDPR, NDAA). Kisi is
  a Point Nine portfolio company; this profile was enriched from Kisi's public
  developer surface.
