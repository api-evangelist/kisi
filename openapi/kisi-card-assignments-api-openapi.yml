  /card_assignments/{activation_token}/activate_with_token:
    post:
      operationId: activateCardAssignmentWithActivationToken
      summary: Activate card assignment with activation token
      tags:
      - Card assignments
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: activation_token
        schema:
          type: string
        in: path
        description: The activation token of the card assignment.
        required: true
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
