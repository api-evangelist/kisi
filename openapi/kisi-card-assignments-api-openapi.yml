        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateCardAssignment
      summary: Update card assignment
      tags:
      - Card assignments
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: The ID of the object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Card Assignment
              properties:
                card_assignment:
                  type: object
                  properties:
                    two_factor_pin:
                      type:
                      - string
                      - 'null'
                      pattern: ^[0-9]{4}$
                      description: Pin code used as two factor authentication for the card assignment.
                    send_two_factor_pin_notification:
                      type: boolean
                      description: Whether to send a notification to the assignee when the two factor pin is set/changed.
                  required: []
              required:
              - card_assignment
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
