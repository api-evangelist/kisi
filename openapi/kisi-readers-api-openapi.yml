    patch:
      operationId: updateReader
      summary: Update reader
      tags:
      - Readers
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: The ID of the object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Reader
              properties:
                reader:
                  type: object
                  properties:
                    buzzer_enabled:
                      type: boolean
                      description: Whether the reader is buzzer enabled
                    checkout:
                      type: boolean
                      description: Whether the reader is checkout enabled
                    description:
                      type:
                      - string
                      - 'null'
                      description: The description of the reader
                    device_unlock_restriction_enabled:
                      type: boolean
                      description: 'Whether the reader is device unlock restriction enabled

                        '
                    elevator_id:
                      type:
                      - integer
                      - 'null'
                      description: The elevator ID of the reader
                    lock_id:
                      type:
                      - integer
                      - 'null'
                      description: The lock ID of the reader
                    name:
                      type: string
                      description: The name of the reader
                    tamper_enabled:
                      type: boolean
                      description: Whether the reader is tamper enabled
                    wave_to_unlock_enabled:
                      type: boolean
                      description: 'Whether the reader is wave to unlock enabled

                        '
                    zone_id:
                      type:
                      - integer
                      - 'null'
                      description: The zone ID of the reader
                    terminal_id:
                      type:
                      - integer
                      - 'null'
                      description: The terminal ID of the reader
                  required: []
              required:
              - reader
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Errors:
      description: Schema describing validation errors.
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
            - can't be blank or invalid
            password:
            - can't be blank
      required:
      - errors
    Error:
      description: Schema describing errors.
      type: object
      properties:
        error:
          type: string
          description: The error message.
          example: Wrong email address or password.
        code:
          type: string
          description: An identifier of the error.
          example: afc516
      required:
      - error
      - code
  securitySchemes:
    Webhook-Signature:
      type: apiKey
      in: header
      name: X-Signature
      description: 'Authorize using a signature of the request body. The signature is a HMAC-SHA256 hash of the request body using a secret key. <br><br>E.g. `X-Signature: 123`'
    Kisi-Login:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorize using a login. Prefix the value with `KISI-LOGIN`<br><br>Example: `Authorization: KISI-LOGIN 123`'
    Kisi-Access-Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorize using an access key. Prefix the value with `KISI-ACCESS-KEY`<br><br>Example: `Authorization: KISI-ACCESS-KEY 123`'
    Kisi-Group-Link:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorize using a group link. Prefix the value with `KISI-GROUP-LINK`<br><br>Example: `Authorization: KISI-GROUP-LINK 123`'
    Kisi-Service:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorize using a service. Prefix the value with `KISI-SERVICE`<br><br>Example: `Authorization: KISI-SERVICE 123`'
    OAuth2Basic:
      type: http
      scheme: basic
      description: Username is the client id. Password is the client secret.
    OAuth2:
      type: oauth2
      description: 'OAuth access tokens are sent as bearer tokens. Example: `Authorization: Bearer youraccesstoken`'
      flows:
        authorizationCode:
          authorizationUrl: https://api.kisi.io/oauth/authorize
          tokenUrl: https://api.kisi.io/oauth/token
          scopes: {}
