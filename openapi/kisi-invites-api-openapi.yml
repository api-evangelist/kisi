                      format: date-time
                      description: When the invite was updated
                    invites_to_type:
                      type: string
                      const: Place
                    invites_to_id:
                      type: integer
                      description: The ID of the place
                    invitee_type:
                      type: string
                      enum:
                      - User
                      - Guest
                      description: The invitee type of the invite
                    invitee_id:
                      type: integer
                      description: The invitee ID of the invite
                    invitee:
                      type: object
                      description: The invitee of the invite
                      oneOf:
                      - type: object
