                          phone_number:
                            type:
                            - string
                            - 'null'
                            description: 'The phone number of the guest. Only US, Canadian and Puerto Rican numbers in the format +11234567890 (E.164) are accepted.

                              '
                        required:
                        - id
                        - resource_type
                        - name
                        - email
                        - phone_number
                        additionalProperties: false
                    access_key:
                      type: object
                      title: Access Key
                      description: Access key for the invitee. Only to be used when invitee is a guest.
                      properties:
                        id:
                          type: integer
                          description: The ID of the access key
                        resource_type:
                          type: string
                          description: The resource type of the access key
