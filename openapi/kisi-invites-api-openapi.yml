                        role_id:
                          type: string
                          description: The role ID of the role assignment.
                      required:
                      - id
                      - resource_type
                      - role_id
                      additionalProperties: false
                  required:
                  - id
                  - resource_type
                  - notify
                  - created_at
                  - updated_at
                  - invites_to_type
                  - invites_to_id
                  - invitee_type
                  - invitee_id
                  - invitee
                  - role_assignment_id
                  - role_assignment
