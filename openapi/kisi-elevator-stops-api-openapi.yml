                      type: integer
                      description: The floor ID of the elevator stop
                    time_restriction_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: 'Whether the elevator stop is time restricted. Time restriction enforces that users may only permit at specific hours

                        '
                  required:
                  - elevator_id
                  - floor_id
              required:
              - elevator_stop
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Elevator Stop
                properties:
                  id:
                    type: integer
                    description: The ID of the elevator stop
                  resource_type:
                    type: string
                    description: The resource type of the elevator stop
                    const: ElevatorStop
                  created_at:
                    type: string
                    format: date-time
                    description: When the elevator stop was created
                  updated_at:
                    type: string
                    format: date-time
                    description: When the elevator stop was updated
                  name:
                    type: string
                    description: The name of the elevator stop
                  locked_down:
                    type: boolean
                    description: 'Whether the elevator stop is currently locked down. When locked down the elevator stop is locked for everyone

                      '
                  locked_down_since:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: 'Since when the elevator stop has been locked down

                      '
                  on_scheduled_permit:
                    type: boolean
                    description: If the elevator stop is on a scheduled unlock
                  permitted:
                    type: boolean
                    description: Whether the elevator stop is currently permitted
                  time_restriction_enabled:
                    type:
                    - boolean
                    - 'null'
                    description: 'Whether the elevator stop is time restricted. Time restriction enforces that users may only permit at specific hours

                      '
                  elevator_id:
                    type: integer
                    description: The elevator ID of the elevator stop
                  elevator:
                    type: object
                    title: Elevator
                    description: The elevator of the elevator stop
                    properties:
                      id:
                        type: integer
                        description: The ID of the elevator
                      resource_type:
                        type: string
                        description: The resource type of the elevator
                        const: Elevator
                      name:
                        type: string
                        description: The name of the elevator
                    required:
                    - id
                    - resource_type
                    - name
                    additionalProperties: false
                  floor_id:
                    type: integer
                    description: The floor ID of the elevator stop
                  floor:
                    type: object
                    title: Floor
                    description: The floor of the elevator stop
                    properties:
                      id:
                        type: integer
                        description: The ID of the floor
                      resource_type:
                        type: string
                        description: The resource type of the floor
                        const: Floor
                      name:
                        type: string
                        description: The name of the floor
                      number:
                        type: integer
                        description: The number of the floor
                    required:
                    - id
                    - resource_type
                    - name
                    - number
                    additionalProperties: false
                  place_id:
                    type: integer
                    description: The place ID of the elevator stop
                  place:
                    type: object
                    title: Place
                    description: The place of the elevator stop
                    properties:
                      id:
                        type: integer
                        description: The ID of the place
                      resource_type:
                        type: string
                        description: The resource type of the place
                        const: Place
                      name:
                        type: string
                        description: The name of the place
                    required:
                    - id
                    - resource_type
                    - name
                    additionalProperties: false
                required:
                - id
                - resource_type
                - created_at
                - updated_at
                - name
                - locked_down
                - locked_down_since
                - on_scheduled_permit
                - permitted
                - time_restriction_enabled
                - elevator_id
                - elevator
                - floor_id
                - floor
                - place_id
                - place
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
