                      place_id:
                        type: integer
                        description: The place ID of the camera
                      lock_id:
                        type:
                        - integer
                        - 'null'
                        description: The lock ID of the camera
                      lock:
                        type: object
                        title: Lock
                        description: The lock of the camera
                        properties:
                          id:
                            type: integer
                            description: The ID of the lock
                          resource_type:
                            type: string
                            description: The resource type of the lock
                            const: Lock
                          name:
                            type: string
                            description: The name of the lock
                        required:
