openapi: 3.2.0
info:
  version: 1.0.0
  title: Kisi Cameras API
  description: '## Introduction


    Welcome to the Kisi API documentation.'
  contact:
    name: Kisi Support
    email: support@getkisi.com
servers:
- url: https://api.kisi.io
  description: Kisi Production
tags:
- name: Cameras
paths:
  /cameras:
    get:
      operationId: fetchCameras
      summary: Fetch cameras
      tags:
      - Cameras
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: ids
        in: query
        schema:
          type: string
        description: Filter by object IDs
      - name: place_id
        in: query
        schema:
          type: integer
        description: Filter by place ID
      - name: lock_id
        in: query
        schema:
          type: integer
        description: Filter by lock ID
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - -name
        description: 'Sort the results. Prepend `-` to sort in reverse order.


          `name` - sort by camera name, alphabetically

          `-name` sort by camera name in reverse order

          '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  oneOf:
                  - type: object
                    title: Rhombus Systems Camera
                    properties:
                      id:
                        type: integer
                        description: The ID of the camera
                      resource_type:
                        type: string
                        description: The resource type of the camera
                        const: Camera
                      name:
                        type: string
                        description: The name of the camera
                      description:
                        type:
                        - string
                        - 'null'
                        description: The description of the camera
                      created_at:
                        type: string
                        format: date-time
                        description: When the camera was created
                      updated_at:
                        type: string
                        format: date-time
                        description: When the camera was updated
                      metadata:
                        type: object
                        description: 'The metadata for the camera.

                          - Only basic types are allowed: string, null, integer, float, boolean.

                          - Keys have a limit of 50 characters.

                          - Values have a limit of 500 characters.

                          - Keys number is limited to 50.

                          '
                      enabled:
                        type: boolean
                        description: 'Whether the camera is enabled or not. Only enabled cameras takes snapshots.

                          '
                      clip_duration:
                        type: integer
                        minimum: 3
                        maximum: 60
                        description: Duration in seconds of the video clip to take.
                      number_of_snapshots:
                        type: integer
                        minimum: 1
                        maximum: 9
                        description: The number of snapshots to fetch.
                      remote_id:
                        type: string
                        description: The remote id of the camera.
                      snapshot_offset:
                        type: integer
                        minimum: -30
                        maximum: 30
                        description: Offset in seconds of the clock of the camera if it has a drift from the API.
                      supports_clips:
                        type: boolean
                        description: Whether the camera supports clips.
                      supports_images:
                        type: boolean
                        description: Whether the camera supports images.
                      supports_thumbnails:
                        type: boolean
                        description: Whether the camera supports thumbnails.
                      status:
                        type: string
                        enum:
                        - online
                        - offline
                        description: Whether the camera is online or offline.
                      status_changed_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: When the camera connectivity status last changed.
                      place_id:
                        type: integer
                        description: The place ID of the camera
                      lock_id:
                        type:
                        - integer
                        - 'null'
                        description: The lock ID of the camera
                      lock:
                        type: object
                        title: Lock
                        description: The lock of the camera
                        properties:
                          id:
                            type: integer
                            description: The ID of the lock
                          resource_type:
                            type: string
                            description: The resource type of the lock
                            const: Lock
                          name:
                            type: string
                            description: The name of the lock
                        required:
                        - id
                        - resource_type
                        - name
                        additionalProperties: false
                      type:
                        type: string
                        const: rhombus_systems
                        description: The type of the camera.
                      integration_id:
                        type: integer
                        description: The integration ID of the camera
                      integration:
                        type: object
                        title: Integration
                        description: The integration of the camera
                        properties:
                          id:
                            type: integer
                            description: The ID of the integration
                          resource_type:
                            type: string
                            description: The resource type of the integration
                            const: Integration
                          name:
                            type: string
                            description: The name of the integration
                          type:
                            type: string
                            enum:
                            - rhombus_systems_camera
                            description: The type of the integration.
                        required:
                        - id
                        - resource_type
                        - name
                        - type
                        additionalProperties: false
                    required:
                    - id
                    - resource_type
                    - name
                    - description
                    - created_at
                    - updated_at
                    - metadata
                    - enabled
                    - clip_duration
                    - number_of_snapshots
                    - remote_id
                    - snapshot_offset
                    - supports_clips
                    - supports_images
                    - supports_thumbnails
                    - status
                    - status_changed_at
