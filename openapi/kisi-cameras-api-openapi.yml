                        - resource_type
                        - name
                        additionalProperties: false
                      type:
                        type: string
                        const: generic
                        description: The type of the camera.
                    required:
                    - id
                    - resource_type
                    - name
                    - description
                    - created_at
                    - updated_at
                    - metadata
                    - enabled
                    - clip_duration
                    - number_of_snapshots
                    - remote_id
                    - snapshot_offset
                    - supports_clips
