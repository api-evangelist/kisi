  /cards/{id}/assign:
    post:
      operationId: assignCard
      summary: Assign card
      description: 'Assigns the card to the user as the primary card.

        If the user already has a primary card, it assigns the card as backup.

        '
      tags:
      - Cards
      security:
      - Kisi-Login: []
      - OAuth2: []
      deprecated: true
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: The ID of the object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Card
              properties:
                card:
                  type: object
                  properties:
