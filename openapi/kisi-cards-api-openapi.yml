paths:
  /cards:
    get:
      operationId: fetchCards
      summary: Fetch cards
      tags:
      - Cards
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: ids
        in: query
        schema:
          type: string
        description: Filter by object IDs
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          maximum: 250
        description: The number of objects to return
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          maximum: 20000
        description: The number of objects to offset
      - name: status
        in: query
        schema:
          type: string
          enum:
          - activated
          - deactivated
          - unassigned
        description: Filter by status
      - name: token
        in: query
        schema:
          type: string
        description: Filter by the token of the card.
      - name: data_block_value
        in: query
        schema:
          type: string
        description: Filter by the data_block_value of the card. Only relevant for Mifare Classic cards.
      - name: uid
        in: query
        schema:
          type: string
        description: Filter by the uid of the card.
      - name: user_id
        in: query
        schema:
          type:
          - integer
          - string
        description: Filter by user ID or by current user if value is `me`.
        deprecated: true
      - name: facility_code
        in: query
        schema:
          type: integer
        description: Filter by the facility code of the record. Only relevant for LF cards.
      - name: activated
        in: query
        deprecated: true
        schema:
          type: boolean
        description: Filter by the activation status of the card.
      - name: card_number
        in: query
        schema:
          type: integer
        description: Filter by the card number of the record. Only relevant for LF cards.
      - name: card_id
        in: query
        schema:
          type: integer
        description: Filter by the card id of the record. Only relevant for LF cards.
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - last_used_at
          - -last_used_at
        description: 'Sort the results. Prepend `-` to sort in reverse order.


          `last_used_at` - sort by when the card was last used

          '
