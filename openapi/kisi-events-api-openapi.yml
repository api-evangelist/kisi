paths:
  /events/meta:
    get:
      operationId: fetchEventMetadata
      summary: Fetch Event Metadata
      tags:
      - Events
      security:
      - Kisi-Login: []
      - OAuth2: []
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object_type_to_action:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                - object_type_to_action
                description: A mapping between object type and action values
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
