                        format: date-time
                        description: When the controller relay connection was created
                      updated_at:
                        type: string
                        format: date-time
                        description: When the controller relay connection was updated
                      name:
                        type:
                        - string
                        - 'null'
                        description: The name of the controller relay connection
                      duration:
                        type: number
                        format: float
                        minimum: 0.5
                        maximum: 600.0
                        description: The duration of the relay
                      type:
                        const: lock
                      controller_relay_id:
                        type: integer
                        description: The controller_relay ID of the controller relay connection. Must not be aux.
                      controller_relay:
                        type: object
                        title: Controller Relay
                        description: The controller_relay of the controller relay connection
                        properties:
                          id:
                            type: integer
                            description: The ID of the controller relay
                          channel:
                            type: number
