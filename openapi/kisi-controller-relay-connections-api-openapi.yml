paths:
  /controller_relay_connections:
    get:
      operationId: fetchControllerRelayConnections
      summary: Fetch controller relay connections
      tags:
      - Controller Relay Connections
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: controller_id
        in: query
        schema:
          type: integer
        required: true
        description: Filter by controller ID
      responses:
        '200':
          description: OK
