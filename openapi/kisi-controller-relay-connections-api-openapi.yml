                            type: integer
                            description: The ID of the lock
                          resource_type:
                            type: string
                            description: The resource type of the lock
                            const: Lock
                          name:
                            type: string
                            description: The name of the lock
                        required:
                        - id
                        - resource_type
                        - name
                        additionalProperties: false
                    required:
                    - id
                    - created_at
                    - updated_at
                    - name
                    - duration
                    - type
                    - controller_relay_id
                    - controller_relay
                    - lock_id
                    - lock
                    additionalProperties: false
                  - type: object
