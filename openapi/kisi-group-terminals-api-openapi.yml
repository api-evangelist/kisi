openapi: 3.2.0
info:
  version: 1.0.0
  title: Kisi Group terminals API
  description: '## Introduction


    Welcome to the Kisi API documentation.'
  contact:
    name: Kisi Support
    email: support@getkisi.com
servers:
- url: https://api.kisi.io
  description: Kisi Production
tags:
- name: Group terminals
paths:
  /group_terminals:
    get:
      operationId: fetchGroupTerminals
      summary: Fetch group terminals
      tags:
      - Group terminals
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: group_id
        in: query
        schema:
          type: integer
        required: true
        description: The ID of the group to scope by
      - name: ids
        in: query
        schema:
          type: string
        description: Filter by object IDs
      - name: terminal_id
        in: query
        schema:
          type: integer
        description: Filter by terminal ID
      - name: query
        in: query
        schema:
          type: string
        description: 'Filter by a freetext string. Properties searched: `name`

          '
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          maximum: 250
        description: The number of objects to return
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          maximum: 20000
        description: The number of objects to offset
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Group Terminal
                  properties:
                    id:
                      type: integer
                      description: The ID of the group terminal
                    resource_type:
                      type: string
                      description: The resource type of the group terminal
                      const: GroupTerminal
                    created_at:
                      type: string
                      format: date-time
                      description: When the group terminal was created
                    updated_at:
                      type: string
                      format: date-time
                      description: When the group terminal was updated
                    group_id:
                      type: integer
                      description: The group ID of the group terminal
                    group:
                      type: object
                      title: Group
                      description: The group of the group terminal
                      properties:
                        id:
                          type: integer
                          description: The ID of the group
                        resource_type:
                          type: string
                          description: The resource type of the group
                          const: Group
                        name:
                          type: string
                          description: The name of the group
                      required:
                      - id
                      - resource_type
                      - name
                      additionalProperties: false
                    terminal_id:
                      type: integer
                      description: The terminal ID of the group terminal
                    terminal:
                      type: object
                      title: Terminal
                      description: The terminal of the group terminal
                      properties:
                        id:
                          type: integer
                          description: The ID of the terminal
                        description:
                          type:
                          - string
                          - 'null'
                          description: The description of the terminal
                        name:
                          type: string
                          description: The name of the terminal
                      required:
                      - id
                      - description
                      - name
                      additionalProperties: false
                    place_id:
                      type: integer
                      description: The place ID of the group terminal
                    place:
                      type: object
                      title: Place
                      description: The place of the group terminal
                      properties:
                        id:
                          type: integer
                          description: The ID of the place
                        resource_type:
                          type: string
                          description: The resource type of the place
                          const: Place
                        name:
                          type: string
                          description: The name of the place
                      required:
                      - id
                      - resource_type
                      - name
                      additionalProperties: false
                  required:
                  - id
                  - resource_type
                  - created_at
                  - updated_at
                  - group_id
                  - group
                  - terminal_id
                  - terminal
                  - place_id
                  - place
                  additionalProperties: false
          headers:
            X-Collection-Range:
              description: 'Pagination information for offset based pagination. `start-end` represents the range

                of items requested. `total` represents the total count of items. If there is a total

                of 15 items and an offset of 10 and limit of 10 is used, the resulting header is:

                `10-19/15`.

                '
              schema:
                type: string
                pattern: ^(?<start>\d+)-(?<end>\d+)/(?<total>\d+)$
              example: 0-9/200
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createGroupTerminal
      summary: Create group terminal
      tags:
      - Group terminals
      security:
      - Kisi-Login: []
      - OAuth2: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Group Terminal
              properties:
                group_terminal:
                  type: object
                  properties:
                    group_id:
                      type: integer
                      description: The group ID of the group terminal
                    terminal_id:
                      type: integer
                      description: The terminal ID of the group terminal
                  required:
                  - group_id
                  - terminal_id
              required:
              - group_terminal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Group Terminal
                properties:
                  id:
                    type: integer
                    description: The ID of the group terminal
                  resource_type:
                    type: string
                    description: The resource type of the group terminal
                    const: GroupTerminal
                  created_at:
                    type: string
                    format: date-time
                    description: When the group terminal was created
                  updated_at:
                    type: string
                    format: date-time
                    description: When the group terminal was updated
                  group_id:
                    type: integer
                    description: The group ID of the group terminal
                  group:
                    type: object
                    title: Group
                    description: The group of the group terminal
                    properties:
                      id:
                        type: integer
                        description: The ID of the group
                      resource_type:
                        type: string
                        description: The resource type of the group
                        const: Group
                      name:
                        type: string
                        description: The name of the group
                    required:
                    - id
                    - resource_type
                    - name
                    additionalProperties: false
                  terminal_id:
                    type: integer
                    description: The terminal ID of the group terminal
                  terminal:
                    type: object
                    title: Terminal
                    description: The terminal of the group terminal
                    properties:
                      id:
                        type: integer
                        description: The ID of the terminal
                      description:
                        type:
                        - string
                        - 'null'
                        description: The description of the terminal
                      name:
                        type: string
                        description: The name of the terminal
                    required:
                    - id
                    - description
                    - name
                    additionalProperties: false
                  place_id:
                    type: integer
                    description: The place ID of the group terminal
                  place:
                    type: object
                    title: Place
                    description: The place of the group terminal
                    properties:
                      id:
                        type: integer
                        description: The ID of the place
                      resource_type:
                        type: string
                        description: The resource type of the place
                        const: Place
                      name:
                        type: string
                        description: The name of the place
                    required:
                    - id
                    - resource_type
                    - name
                    additionalProperties: false
                required:
                - id
                - resource_type
                - created_at
                - updated_at
                - group_id
                - group
                - terminal_id
                - terminal
                - place_id
                - place
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /group_terminals/{id}:
    get:
      operationId: fetchGroupTerminal
      summary: Fetch group terminal
      tags:
      - Group terminals
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: The ID of the object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Group Terminal
                properties:
                  id:
                    type: integer
                    description: The ID of the group terminal
                  resource_type:
                    type: string
                    description: The resource type of the group terminal
                    const: GroupTerminal
                  created_at:
                    type: string
                    format: date-time
                    description: When the group terminal was created
                  updated_at:
                    type: string
                    format: date-time
                    description: When the group terminal was updated
                  group_id:
                    type: integer
                    description: The group ID of the group terminal
                  group:
                    type: object
                    title: Group
                    description: The group of the group terminal
                    properties:
                      id:
                        type: integer
                        description: The ID of the group
                      resource_type:
                        type: string
                        description: The resource type of the group
                        const: Group
                      name:
                        type: string
                        description: The name of the group
                    required:
                    - id
                    - resource_type
                    - name
                    additionalProperties: false
                  terminal_id:
                    type: integer
                    description: The terminal ID of the group terminal
                  terminal:
                    type: object
                    title: Terminal
                    description: The terminal of the group terminal
                    properties:
                      id:
                        type: integer
                        description: The ID of the terminal
                      description:
                        type:
                        - string
                        - 'null'
                        description: The description of the terminal
                      name:
                        type: string
                        description: The name of the terminal
                    required:
                    - id
                    - description
                    - name
                    additionalProperties: false
                  place_id:
                    type: integer
                    description: The place ID of the group terminal
                  place:
                    type: object
                    title: Place
                    description: The place of the group terminal
                    properties:
                      id:
                        type: integer
                        description: The ID of the place
                      resource_type:
                        type: string
                        description: The resource type of the place
                        const: Place
                      name:
                        type: string
                        description: The name of the place
                    required:
                    - id
                    - resource_type
                    - name
                    additionalProperties: false
                required:
                - id
                - resource_type
                - created_at
                - updated_at
                - group_id
                - group
                - terminal_id
                - terminal
                - place_id
                - place
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteGroupTerminal
      summary: Delete group terminal
      tags:
      - Group terminals
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: The ID of the object
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      description: Schema describing errors.
      type: object
      properties:
        error:
          type: string
          description: The error message.
          example: Wrong email address or password.
        code:
          type: string
          description: An identifier of the error.
          example: afc516
      required:
      - error
      - code
    Errors:
      description: Schema describing validation errors.
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
            - can't be blank or invalid
            password:
            - can't be blank
      required:
      - errors
  securitySchemes:
    Webhook-Signature:
      type: apiKey
      in: header
      name: X-Signature
      description: 'Authorize using a signature of the request body. The signature is a HMAC-SHA256 hash of the request body using a secret key. <br><br>E.g. `X-Signature: 123`'
    Kisi-Login:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorize using a login. Prefix the value with `KISI-LOGIN`<br><br>Example: `Authorization: KISI-LOGIN 123`'
    Kisi-Access-Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorize using an access key. Prefix the value with `KISI-ACCESS-KEY`<br><br>Example: `Authorization: KISI-ACCESS-KEY 123`'
    Kisi-Group-Link:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorize using a group link. Prefix the value with `KISI-GROUP-LINK`<br><br>Example: `Authorization: KISI-GROUP-LINK 123`'
    Kisi-Service:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorize using a service. Prefix the value with `KISI-SERVICE`<br><br>Example: `Authorization: KISI-SERVICE 123`'
    OAuth2Basic:
      type: http
      scheme: basic
      description: Username is the client id. Password is the client secret.
    OAuth2:
      type: oauth2
      description: 'OAuth access tokens are sent as bearer tokens. Example: `Authorization: Bearer youraccesstoken`'
      flows:
        authorizationCode:
          authorizationUrl: https://api.kisi.io/oauth/authorize
          tokenUrl: https://api.kisi.io/oauth/token
          scopes: {}
