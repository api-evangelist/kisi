                          type: string
                          description: The name of the place
                        latitude:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: The latitude of the place
                        longitude:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: The longitude of the place
                      required:
                      - id
                      - name
                      - latitude
                      - longitude
                      additionalProperties: false
                  required:
                  - id
