                      - boolean
                      - 'null'
                      description: 'Whether the lock is time restricted. Time restriction enforces that users may only unlock at specific hours.

                        '
                    order_id:
                      type:
                      - integer
                      - 'null'
                      description: 'The position of the lock, determining the sort order of the locks.

                        '
                    floor_id:
                      type:
                      - integer
                      - 'null'
                      description: The floor ID of the lock
                    place_id:
                      type: integer
                      description: The place ID of the lock
                    favorite:
                      type: boolean
                      description: 'Whether the lock is marked as a favorite by the user. Only shown if requested.

                        '
                  required:
                  - name
                  - place_id
              required:
              - lock
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                oneOf:
                - type: object
                  title: Lock - when authenticated by group link
