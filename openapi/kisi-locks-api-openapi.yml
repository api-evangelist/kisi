      operationId: unlockLock
      summary: Unlock lock
      tags:
      - Locks
      security:
      - Kisi-Login: []
      - OAuth2: []
      - Kisi-Group-Link: []
      - Kisi-Access-Key: []
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: The ID of the object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Lock
              properties:
                context:
                  type: object
                  properties:
                    location:
                      type: object
                      description: The user's current location (based on the WGS 84 coordinate system) for geo-fence restricted locks.
                      properties:
                        longitude:
                          type: number
                          format: float
                          description: The longitude of the user's location
                        latitude:
                          type: number
                          format: float
                          description: The latitude of the user's location
                      required:
                      - longitude
                      - latitude
                    services:
                      type: array
                      items:
                        type: object
                        description: The state of a service on the user's device, used to evaluate restrictions during unlock.
                        properties:
                          type:
                            type: string
                            enum:
                            - BLE
                            - GPS
                            - NFC
                            description: The type of the service.
                          available:
                            type: boolean
                            description: Whether the service is available on the device.
                          enabled:
                            type: boolean
                            description: Whether the service is enabled by the user.
                          authorized:
                            type: boolean
                            description: Whether the app is authorized to use the service.
                        required:
                        - type
                      description: The state of services on the user's device.
                  required: []
                lock:
                  type: object
                  properties:
                    proximity_proof:
                      type:
                      - string
                      - 'null'
                      description: Proximity proof to verify proximity to lock.
                  required:
                  - proximity_proof
              required: []
      responses:
        '200':
          description: OK
          content:
            application/json:
