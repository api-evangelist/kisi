  /user/2fa/activate:
    post:
      operationId: activate2fa
      summary: Activate 2FA for user
      description: 'Organization users will be able to access this endpoint only if their organization has sso flow disabled.


        Requires additional `Basic` authorization. Check [Authentication section](#section/Setup/Authentication) for the details.

        '
