                - resource_type
                - name
                - email
                - created_at
                - updated_at
                - metadata
                - image
                - otp_required_for_login
                - password_flow_enabled
                - access_enabled
                - last_accessed_at
                - scim_access_enabled
                - notes
                - organization_id
                - confirmed
                - groups_count
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateUser
      summary: Update user
      tags:
      - Users
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: The ID of the object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: User
              properties:
                user:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the user
                    image:
                      type:
                      - string
                      - 'null'
                      format: uri
                      description: The url to the image of the user.
                    access_enabled:
                      type: boolean
                      description: 'Whether the user is allowed to access locks and elevators.


                        If the user is managed by SCIM, user access will be disabled

                        unless *both* the `access_enabled` field and

                        `scim_access_enabled` fields are set to `true`.

                        '
                    password_flow_enabled:
                      type: boolean
                      description: Whether the user can login with password flow. Only relevant for organizations.
                    metadata:
                      type: object
                      description: 'The metadata for the user.

                        - Only basic types are allowed: string, null, integer, float, boolean.

                        - Keys have a limit of 50 characters.

                        - Values have a limit of 500 characters.

                        - Keys number is limited to 50.

                        '
                    notes:
                      type:
