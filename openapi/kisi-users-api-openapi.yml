  /user:
    get:
      operationId: fetchCurrentUser
      summary: Fetch current user
      tags:
      - Users
      security:
      - Kisi-Login: []
      - OAuth2: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: User
                properties:
                  id:
                    type: integer
                    description: The ID of the user
                  resource_type:
                    type: string
                    description: The resource type of the user
                    const: User
                  name:
                    type: string
                    description: The name of the user
                  email:
                    type: string
                    format: email
                    description: The email of the user.
                  image:
                    type:
                    - string
                    - 'null'
                    format: uri
                    description: The url to the image of the user.
                  locale:
                    enum:
                    - en
                    - fr
                    - es
                    - de
                    - null
                    type:
                    - string
                    - 'null'
                    description: The preferred language of the user
                  notifications_unread_count:
                    type: integer
                    minimum: 0
                    description: The count of unread notifications.
                  otp_required_for_login:
                    type: boolean
                    description: Whether OTP/2FA is required for login.
                  otp_enabled_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: When was the OTP/2FA enabled.
                  primary_login_exists:
                    type: boolean
                    description: Whether the user has a primary login.
                  created_at:
                    type: string
                    format: date-time
                    description: When the user was created
                  updated_at:
                    type: string
                    format: date-time
                    description: When the user was updated
                  announcements_last_seen_at:
                    deprecated: true
                    type:
                    - string
                    - 'null'
                    format: date-time
                  last_read_at:
                    type:
                    - object
                    - 'null'
                    maxProperties: 50
                    additionalProperties:
                      type: string
                      format: date-time
                    description: When the user read various notifications. At most 50 fields can be stored.
                  notes:
                    type:
                    - string
                    - 'null'
                    description: The notes for the user.
                  organization_id:
                    type: integer
                    description: The organization ID of the user
                  organization:
                    type: object
                    title: Organization
                    description: The organization of the user
                    properties:
