                        description: When the role assignment was updated
                      role_id:
                        type: string
                        description: The role ID of the role assignment.
                      notify:
                        type: boolean
                        description: Whether an email should be sent to the user when this role assignment is created or updated.
                      applies_to_type:
                        type: string
                        const: Organization
                      applies_to_id:
                        type: integer
                        description: The applies_to ID of the role assignment
                      applies_to:
                        type: object
                        description: The applies_to of the role assignment
                        oneOf:
                        - type: object
