- name: Role assignments
paths:
  /role_assignments:
    get:
      operationId: fetchRoleAssignments
      summary: Fetch role assignments
      tags:
      - Role assignments
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: ids
        in: query
        schema:
          type: string
        description: Filter by object IDs
      - name: query
        in: query
        schema:
          type: string
        description: 'Filter by a freetext string. Properties searched: `user.email`, `user.name`

          '
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          maximum: 250
        description: The number of objects to return
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          maximum: 20000
        description: The number of objects to offset
      - name: role_id
        in: query
        schema:
          type: string
        description: Filter by role ID
      - name: assignee_type
        in: query
        schema:
          type: string
          enum:
          - User
          - Team
          - Guest
        description: Filter by assignee type
      - name: assignee_id
        in: query
        schema:
          type: integer
        description: Filter by assignee ID. Must be used with `assignee_type`
      - name: applies_to_type
        in: query
        schema:
          type: string
          enum:
          - Organization
          - Place
          - Group
        description: Filter by applies to type
      - name: applies_to_id
        in: query
        schema:
          type: integer
        description: Filter by applies to ID. Must be used with `applies_to_type`
      - name: scope
        deprecated: true
        in: query
        schema:
          type: string
          enum:
          - organization
          - place
          - group
          - team
        description: Filter by scope
      - name: user_id
        in: query
        schema:
          type:
          - integer
          - string
        description: Filter by user ID or by current user if value is `me`.
        deprecated: true
      - name: place_id
        in: query
        schema:
          type: integer
        description: Filter by place ID
        deprecated: true
      - name: group_id
        in: query
        schema:
          type: integer
        description: Filter by group ID
        deprecated: true
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - user.name
          - -user.name
        description: 'Sort the results. Prepend `-` to sort in reverse order.

          `user.name` - sort by user name, alphabetically

          '
