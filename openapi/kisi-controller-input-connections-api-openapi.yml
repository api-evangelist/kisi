                        - stay
                        - disarmed
                        - violated
                    required:
                    - id
                    - created_at
                    - updated_at
                    - name
                    - controller_input_id
                    - controller_input
                    - zone_id
                    - zone
                    - type
                    - action
                    additionalProperties: false
