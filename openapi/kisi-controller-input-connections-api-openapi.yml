                        title: Controller Input
                        description: The controller_input of the controller input connection
                        properties:
                          id:
                            type: integer
                            description: The ID of the controller input
                          channel:
                            type: number
                            description: The channel of the controller input
                          name:
                            type: string
                            description: The name of the controller input
                        required:
                        - id
                        - channel
                        - name
                        additionalProperties: false
                      zone_id:
                        type: integer
                        description: The zone ID of the controller input connection
                      zone:
                        type: object
                        title: Zone
                        description: The zone of the controller input connection
