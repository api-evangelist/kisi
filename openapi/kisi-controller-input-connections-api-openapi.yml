                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        maximum: 100000
                      end_of_line_second_resistor:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        maximum: 100000
                    required:
                    - id
                    - created_at
                    - updated_at
                    - name
                    - controller_input_id
                    - controller_input
                    - type
                    - enabled
                    - end_of_line_type
                    - end_of_line_main_resistor
                    - end_of_line_second_resistor
                    additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
