- name: Controller Input Connections
paths:
  /controller_input_connections:
    get:
      operationId: fetchControllerInputConnections
      summary: Fetch controller input connections
      tags:
      - Controller Input Connections
      security:
      - Kisi-Login: []
      - OAuth2: []
      parameters:
      - name: controller_id
        in: query
        schema:
          type: integer
        required: true
        description: Filter by controller ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  oneOf:
                  - type: object
                    title: Contact Sensor Connection
                    properties:
                      id:
                        type: integer
                        description: The ID of the controller input connection
                      created_at:
                        type: string
                        format: date-time
                        description: When the controller input connection was created
                      updated_at:
                        type: string
                        format: date-time
                        description: When the controller input connection was updated
                      name:
                        type:
                        - string
                        - 'null'
                        description: The name of the controller input connection
                      controller_input_id:
                        type: integer
                        description: The controller_input ID of the controller input connection
                      controller_input:
                        type: object
                        title: Controller Input
                        description: The controller_input of the controller input connection
                        properties:
                          id:
                            type: integer
                            description: The ID of the controller input
                          channel:
                            type: number
                            description: The channel of the controller input
                          name:
                            type: string
                            description: The name of the controller input
                        required:
                        - id
                        - channel
                        - name
                        additionalProperties: false
                      lock_id:
                        type: integer
                        description: The lock ID of the controller input connection
                      lock:
                        type: object
                        title: Lock
                        description: The lock of the controller input connection
                        properties:
                          id:
                            type: integer
                            description: The ID of the lock
                          resource_type:
                            type: string
                            description: The resource type of the lock
                            const: Lock
                          name:
                            type: string
                            description: The name of the lock
                        required:
                        - id
                        - resource_type
                        - name
                        additionalProperties: false
                      type:
                        const: contact_sensor
                      enabled:
                        type: boolean
                        description: Whether the input is enabled
                      duration:
                        type: number
                        format: float
                        minimum: 3.0
                        maximum: 600.0
                        description: The duration of the input
                      end_of_line_type:
                        type:
                        - string
                        - 'null'
                        enum:
                        - cut_detect
                        - short_detect
                        - cut_and_short_detect
                        - null
                        description: The end of line type of the input
                      end_of_line_main_resistor:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        maximum: 100000
                      end_of_line_second_resistor:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        maximum: 100000
                    required:
                    - id
                    - created_at
                    - updated_at
                    - name
                    - controller_input_id
                    - controller_input
                    - lock_id
                    - lock
                    - type
                    - enabled
                    - duration
                    - end_of_line_type
                    - end_of_line_main_resistor
                    - end_of_line_second_resistor
                    additionalProperties: false
                  - type: object
                    title: Request To Exit Connection
                    properties:
                      id:
                        type: integer
                        description: The ID of the controller input connection
                      created_at:
                        type: string
                        format: date-time
                        description: When the controller input connection was created
                      updated_at:
                        type: string
                        format: date-time
                        description: When the controller input connection was updated
                      name:
                        type:
                        - string
                        - 'null'
                        description: The name of the controller input connection
                      controller_input_id:
                        type: integer
                        description: The controller_input ID of the controller input connection
                      controller_input:
                        type: object
                        title: Controller Input
                        description: The controller_input of the controller input connection
                        properties:
                          id:
                            type: integer
                            description: The ID of the controller input
                          channel:
                            type: number
                            description: The channel of the controller input
                          name:
                            type: string
                            description: The name of the controller input
                        required:
                        - id
                        - channel
                        - name
                        additionalProperties: false
                      lock_id:
                        type: integer
                        description: The lock ID of the controller input connection
                      lock:
                        type: object
                        title: Lock
                        description: The lock of the controller input connection
                        properties:
                          id:
                            type: integer
                            description: The ID of the lock
                          resource_type:
                            type: string
                            description: The resource type of the lock
                            const: Lock
                          name:
                            type: string
                            description: The name of the lock
                        required:
                        - id
                        - resource_type
                        - name
                        additionalProperties: false
                      type:
                        const: request_to_exit
                      enabled:
                        type: boolean
                        description: Whether the input is enabled
                      duration:
                        type: number
                        format: float
                        minimum: 0.5
                        maximum: 600.0
                        description: The duration of the input
                      end_of_line_type:
