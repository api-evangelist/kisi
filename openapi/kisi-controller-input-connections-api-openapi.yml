                    - name
                    - controller_input_id
                    - controller_input
                    - lock_id
                    - lock
                    - type
                    - enabled
                    - duration
                    - end_of_line_type
                    - end_of_line_main_resistor
                    - end_of_line_second_resistor
                    - action
