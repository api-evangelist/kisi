    name: Kisi Support
    email: support@getkisi.com
servers:
- url: https://api.kisi.io
  description: Kisi Production
tags:
- name: Organizations
paths:
  /organizations:
    get:
      operationId: fetchOrganizations
      summary: Fetch organizations
      tags:
      - Organizations
      security:
      - Kisi-Login: []
      - OAuth2: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  oneOf:
                  - type: object
                    title: Organization - when authenticated by group link
                    properties:
                      id:
                        type: integer
                        description: The ID of the organization
                      resource_type:
                        type: string
                        description: The resource type of the organization
                        const: Organization
                      name:
                        type: string
                        description: The name of the organization
                      domain:
                        type: string
                        description: The domain of the organization.
                      logo:
                        type:
                        - string
                        - 'null'
                        format: uri
                        description: The URL to the logo of the organization.
                      address:
                        type:
                        - string
                        - 'null'
                        description: The address of the organization.
                      description:
                        type:
                        - string
                        - 'null'
                        description: The description of the organization
                      time_zone:
                        type:
                        - string
                        example: Europe/London
                        description: 'The time zone of the organization.

                          It should be a <a href="https://en.wikipedia.org/wiki/Tz_database#Names_of_time_zones"> valid IANA time zone name.</a>

                          '
                      transfer_to_id:
                        type:
                        - integer
                        - 'null'
                        description: The transfer_to ID of the organization
                      transfer_to:
                        type: object
                        title: User
                        description: The transfer_to of the organization
                        properties:
                          id:
                            type: integer
                            description: The ID of the user
                          resource_type:
                            type: string
                            description: The resource type of the user
                            const: User
                          email:
                            type: string
                            format: email
                            description: The email of the user.
                          name:
                            type: string
                            description: The name of the user
                        required:
                        - id
                        - resource_type
                        - email
                        - name
                        additionalProperties: false
                      image:
                        deprecated: true
                        type:
                        - string
                        - 'null'
                      color:
                        deprecated: true
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - resource_type
                    - name
                    - domain
                    - logo
                    - address
                    - description
                    - time_zone
                    - transfer_to_id
                    - image
                    - color
                    additionalProperties: false
                  - type: object
                    title: Organization
                    properties:
                      id:
                        type: integer
                        description: The ID of the organization
                      resource_type:
                        type: string
                        description: The resource type of the organization
                        const: Organization
                      name:
                        type: string
                        description: The name of the organization
                      domain:
                        type: string
                        description: The domain of the organization.
                      logo:
                        type:
                        - string
                        - 'null'
                        format: uri
                        description: The URL to the logo of the organization.
                      address:
                        type:
                        - string
                        - 'null'
                        description: The address of the organization.
                      description:
                        type:
                        - string
                        - 'null'
                        description: The description of the organization
                      device_logins_expire_after:
                        type:
                        - integer
                        - 'null'
                        default: 1209600
                        minimum: 0
                        maximum: 31536000
                        description: 'The device login expiration in seconds.

                          If not defined, it defaults to 2 weeks of inactivity.

                          '
                      places_count:
                        type: integer
                        description: Count of all the places within the organization.
                      scim_enabled:
                        type: boolean
                        description: Whether SCIM is enabled for the organization.
                      sso_flow_enabled:
                        type: boolean
                        description: 'Whether the organization has SSO flow enabled. Mutually exclusive with password flow.

                          '
                      sso_expiration_override_enabled:
                        type: boolean
                        description: 'Whether the organization should override length of SSO session.

                          '
                      sso_expiration_override:
                        type:
                        - integer
                        - 'null'
                        description: 'The length of the SSO session (in seconds) that will override the default passed from Identity Provider.

                          '
                      metadata:
                        type:
                        - string
                        - 'null'
                        description: The SSO metadata of the organization.
                      time_zone:
                        type:
                        - string
                        example: Europe/London
                        description: 'The time zone of the organization.

                          It should be a <a href="https://en.wikipedia.org/wiki/Tz_database#Names_of_time_zones"> valid IANA time zone name.</a>

                          '
                      web_authentication_api_enabled:
                        type: boolean
                        description: 'Whether web authentication api is enabled.

                          Only for organizations using SSO and IdP authentication is done using WebAuthn.

                          '
                      apple_pass_enabled:
                        type: boolean
                        description: Whether Apple Pass is enabled for the organization.
                      created_at:
                        type: string
                        format: date-time
                        description: When the organization was created
                      updated_at:
                        type: string
                        format: date-time
                        description: When the organization was updated
                      user_id:
                        type:
                        - integer
                        - 'null'
                        description: The user ID of the organization
                      transfer_to_id:
                        type:
                        - integer
                        - 'null'
                        description: The transfer_to ID of the organization
                      transfer_to:
                        type: object
                        title: User
                        description: The transfer_to of the organization
                        properties:
                          id:
                            type: integer
                            description: The ID of the user
                          resource_type:
                            type: string
                            description: The resource type of the user
                            const: User
                          email:
                            type: string
                            format: email
                            description: The email of the user.
                          name:
                            type: string
                            description: The name of the user
                        required:
                        - id
                        - resource_type
                        - email
                        - name
                        additionalProperties: false
                      image:
                        deprecated: true
                        type:
                        - string
                        - 'null'
                      color:
                        deprecated: true
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - resource_type
                    - name
                    - domain
                    - logo
                    - address
                    - description
                    - device_logins_expire_after
                    - places_count
                    - scim_enabled
                    - sso_flow_enabled
                    - sso_expiration_override_enabled
                    - sso_expiration_override
                    - metadata
                    - time_zone
                    - web_authentication_api_enabled
                    - apple_pass_enabled
                    - created_at
                    - updated_at
                    - user_id
                    - transfer_to_id
                    - image
                    - color
                    additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organizations/{domain}/public:
    get:
      operationId: fetchPublicOrganization
      summary: Fetch public organization
      tags:
      - Organizations
      parameters:
      - name: domain
        in: path
        schema:
          type: string
        required: true
        description: The domain of the organization.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Organization
                properties:
                  id:
                    type: integer
                    description: The ID of the organization
                  resource_type:
                    type: string
                    description: The resource type of the organization
                    const: Organization
                  name:
                    type: string
                    description: The name of the organization
                  domain:
                    type: string
                    description: The domain of the organization.
                  places_count:
                    type: integer
                    description: Count of all the places within the organization.
                  logo:
                    type:
                    - string
                    - 'null'
                    format: uri
                    description: The URL to the logo of the organization.
                  sso_flow_enabled:
                    type: boolean
                    description: 'Whether the organization has SSO flow enabled. Mutually exclusive with password flow.

                      '
                  web_authentication_api_enabled:
                    type: boolean
                    description: 'Whether web authentication api is enabled.

                      Only for organizations using SSO and IdP authentication is done using WebAuthn.

                      '
                  image:
                    deprecated: true
                    type:
                    - string
                    - 'null'
                  color:
                    deprecated: true
                    type:
                    - string
                    - 'null'
                required:
                - id
                - resource_type
                - name
                - domain
                - places_count
                - logo
                - sso_flow_enabled
                - web_authentication_api_enabled
                - image
                - color
                additionalProperties: false
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organizations/find:
    post:
      operationId: findOrganizations
      summary: Find my organizations
      description: Sends an email to the user including a list of all their organizations.
      tags:
      - Organizations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      description: The user's email.
                  required:
                  - email
              required:
              - user
      responses:
        '204':
          description: No Content
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
